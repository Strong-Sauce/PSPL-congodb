# Application name
spring.application.name=PSPL

# Port - Render injects PORT env var; default to 8080 locally
server.port=${PORT:8080}

# Neo4j / Cogndb Cloud (environment variables only)
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# CORS - which frontend origins are allowed to call the backend
# In production on Render, frontend is served from same origin so this is only needed locally
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Base URL of the app - used to build the password reset link in emails
# In production this should be your Render URL e.g. https://your-app.onrender.com
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.data.neo4j.cypher=TRACE

# Seed data: disabled by default. Set app.seed-data=true (env or property) to enable during development with a running Neo4j.
app.seed-data=false
